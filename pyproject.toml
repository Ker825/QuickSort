[project]
name = "quick-sort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "rich>=15.0.0",
]


[[tool.mypy.overrides]]
module = ["untyped_package.*"]
follow_untyped_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E402"]
"main.py" = ["E402"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["test"]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=8.4",
    "ruff>=0.12",
]

